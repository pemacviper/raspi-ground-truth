services:
  ground-truth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ground-truth
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - GROUND_TRUTH_DB=/data/ground-truth.db
      - GROUND_TRUTH_SEED=/app/ground_truth_seed.json
      - AWS_REGION=eu-central-1
      - EMBEDDING_MODEL=amazon.titan-embed-text-v2:0
      - EMBEDDING_DIMENSIONS=512
    ports:
      - "192.168.1.115:8011:8000"
    volumes:
      - ground_truth_data:/data
    networks:
      - proxy

volumes:
  ground_truth_data:

networks:
  proxy:
    external: true
